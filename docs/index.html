<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chaos Kane</title>
  <style>
    :root {
      color-scheme: light;
      --bg: oklch(97.5% 0.006 85);
      --ink: oklch(22% 0.012 85);
      --muted: oklch(52% 0.012 85);
      --faint: oklch(80% 0.01 85);
      --line: oklch(89% 0.008 85);
      --bad: oklch(50% 0.19 27);
      --bad-tint: oklch(95.5% 0.03 27);
      --ok: oklch(46% 0.11 155);
      --ok-tint: oklch(96% 0.025 155);
      --warn: oklch(58% 0.14 70);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; font-size: 15px; }
    @media (min-width: 900px) { html { font-size: 14px; } }
    @media (min-width: 1700px) { html { font-size: 15px; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.5 var(--sans); }
    main { max-width: 62rem; margin: 0 auto; padding: 1.25rem clamp(1rem, 4vw, 1.5rem) 2.5rem; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; color: var(--muted); font: 0.8125rem var(--mono); }
    .bar strong { color: var(--ink); font-weight: 700; }
    h1 { margin: 1.5rem 0 1.25rem; font-size: 1.9rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em; }
    h1.good { color: var(--ok); }
    h1.bad { color: var(--bad); }
    .claim { margin: -0.75rem 0 1.1rem; font-size: 0.9375rem; color: var(--muted); min-height: 1.4em; }
    .claim b { font-weight: 700; }
    .claim.bad b { color: var(--bad); }
    .claim.good b { color: var(--ok); }
    .claim.warn b { color: var(--warn); }

    .layout { display: grid; grid-template-columns: 13rem 1fr; gap: 2rem; align-items: start; padding-top: 1.25rem; border-top: 1px solid var(--ink); }
    .list { display: flex; flex-direction: column; }
    .item { display: flex; align-items: center; gap: 0.6rem; width: 100%; min-height: 2.4rem; padding: 0.3rem 0.5rem; border: 0; border-radius: 0.3rem; background: none; font: inherit; font-size: 0.9375rem; text-align: left; color: var(--muted); cursor: pointer; }
    .item:hover { background: oklch(93% 0.006 85); }
    .item.selected { background: oklch(93% 0.008 85); color: var(--ink); font-weight: 700; }
    .item:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    .dot { flex: none; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--faint); }
    .item.running .dot { background: var(--ink); animation: pulse 1s ease-in-out infinite; }
    .item.survived .dot { background: var(--ok); }
    .item.failed .dot { background: var(--bad); }
    .item.incomplete .dot { background: var(--warn); }

    .stage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    .stage-head h2 { margin: 0; font-size: 1.15rem; font-weight: 700; }
    .verdict { font: 700 0.8125rem var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .stage.failed .verdict { color: var(--bad); }
    .stage.survived .verdict { color: var(--ok); }
    .stage.incomplete .verdict { color: var(--warn); }

    svg { display: block; width: 100%; height: auto; margin: 0.75rem 0 0.25rem; overflow: visible; }
    .node { fill: #fff9; stroke: var(--ink); stroke-width: 1.5; }
    .node.lie { stroke: var(--bad); fill: var(--bad-tint); }
    .node.true { stroke: var(--ok); fill: var(--ok-tint); }
    .node.empty { stroke: var(--bad); stroke-dasharray: 4 3; }
    .node-label { font: 600 13px var(--mono); fill: var(--ink); text-anchor: middle; }
    .seg-ok { stroke: var(--ink); fill: var(--ink); }
    .seg-bad { stroke: var(--bad); fill: var(--bad); }
    .seg-slow { stroke: var(--warn); fill: var(--warn); }
    .seg-off { stroke: var(--faint); fill: var(--faint); }
    .seg-cut { stroke: var(--faint); fill: var(--faint); }
    .wire { stroke-width: 2; stroke-linecap: round; }
    .off { stroke-dasharray: 3 4; }
    .x { stroke: var(--bad); stroke-width: 2.5; stroke-linecap: round; fill: none; }
    .tag { font: 700 11px var(--mono); fill: var(--bad); text-anchor: middle; }
    .tag.slow { fill: var(--warn); }
    .packet { fill: var(--ink); animation: travel 1.6s ease-in-out infinite; }

    .readouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 0.5rem; }
    .col { padding: 0 0.6rem; text-align: center; }
    .label { margin-bottom: 0.3rem; font: 700 0.6875rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .value { min-height: 2.6rem; font-size: 1.0625rem; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
    .value.mono { font: 0.875rem/1.4 var(--mono); font-weight: 400; color: var(--muted); }
    .value.big { font-size: 2rem; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
    .value.big small { margin-left: 0.4rem; font-size: 0.9375rem; font-weight: 400; color: var(--muted); }
    .stage.failed .col.page .value, .stage.failed .col.truth .value.big { color: var(--bad); }
    .stage.survived .col.truth .value.big { color: var(--ok); }
    .sub { display: block; margin-top: 0.25rem; font: 0.8125rem var(--mono); font-weight: 400; color: var(--muted); }

    .shot { display: block; margin-top: 1.1rem; color: var(--muted); font: 0.75rem var(--mono); text-decoration: none; }
    .shot[hidden] { display: none; }
    .shot .frame { position: relative; display: block; overflow: hidden; aspect-ratio: 11 / 6; border: 1px solid var(--line); border-radius: 0.4rem; margin-bottom: 0.35rem; background: #fff; }
    .shot img { position: absolute; top: 0; left: 50%; width: 250%; max-width: none; transform: translateX(-50%); }
    .shot:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .compare { margin-top: 1.1rem; }
    .compare[hidden] { display: none; }
    .compare .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .compare a { display: block; color: var(--muted); font: 0.75rem var(--mono); text-decoration: none; }
    .compare a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .compare .frame { position: relative; display: block; overflow: hidden; aspect-ratio: 6 / 5; border: 1px solid var(--line); border-radius: 0.4rem; margin-bottom: 0.35rem; background: #fff; }
    .compare img { position: absolute; top: 0; left: 50%; width: 400%; max-width: none; transform: translateX(-50%); }
    .compare .cap b { color: var(--ink); }
    .compare .cap.bad b { color: var(--bad); }
    .compare .cap.good b { color: var(--ok); }
    .fix { margin-top: 1.25rem; }
    .fix[hidden] { display: none; }
    .fix h3 { margin: 0 0 0.35rem; font: 700 0.6875rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .fix pre { margin: 0; max-height: 13rem; overflow: auto; padding: 0.6rem 0.75rem; border: 1px solid var(--line); border-radius: 0.4rem; background: #fff9; font: 0.75rem/1.5 var(--mono); }
    .fix .add { color: var(--ok); }
    .fix .del { color: var(--bad); }
    .fix .hunk { color: var(--muted); }
    .phases { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; margin: 0.9rem 0 0; font: 0.75rem var(--mono); color: var(--faint); }
    .phase { padding: 0.15rem 0; border-bottom: 2px solid transparent; }
    .phase.done { color: var(--ok); }
    .phase.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
    .diag { margin-top: 1.25rem; }
    .diag[hidden] { display: none; }
    .diag h3 { margin: 0 0 0.35rem; font: 700 0.6875rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .diag ul { margin: 0; padding: 0; list-style: none; }
    .diag li { padding: 0.5rem 0; border-top: 1px solid var(--line); }
    .diag li b { color: var(--bad); }
    .diag .names { display: block; margin-top: 0.1rem; color: var(--muted); font-size: 0.8125rem; }
    .compare a.ghost { visibility: hidden; }
    .compare.dim { visibility: hidden; }
    .controls { margin-left: 0.5rem; }
    .now { margin-top: 1.1rem; min-height: 1.4em; font: 0.8125rem var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now.fault { color: var(--bad); font-weight: 700; }

    button.again { margin-left: 0.6rem; padding: 0.15rem 0.6rem; font: inherit; font-size: 0.75rem; color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 0.3rem; cursor: pointer; }
    button.again:hover { background: var(--ink); color: var(--bg); }
    button.again:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(280px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .item.running .dot, .packet { animation: none; } }
    @media (max-width: 720px) {
      .compare .pair { grid-template-columns: 1fr; }
      h1 { margin: 1.1rem 0 1rem; font-size: 1.6rem; }
      .bar { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
      .layout { grid-template-columns: 1fr; gap: 1rem; }
      .list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.15rem 0.5rem; }
      .readouts { grid-template-columns: 1fr; gap: 0.75rem; }
      .col { padding: 0; text-align: left; }
      .value { min-height: 0; }
      .node-label { font-size: 19px; }
      .tag { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="bar"><strong>chaos-kane</strong><span><span id="target"></span><span id="mode"></span></span></div>
    <h1 id="headline">Waiting for a run</h1>
    <p class="claim" id="claim"></p>
    <div class="phases" id="phases" aria-label="Steps"></div>

    <div class="layout">
      <nav class="list" id="list" aria-label="Scenarios"></nav>
      <section class="stage" id="stage" aria-live="polite">
        <div class="stage-head"><h2 id="stageTitle">Nothing running yet</h2><span class="verdict" id="verdict"></span></div>
        <svg id="wire" viewBox="0 0 600 96" role="img" aria-label="Path of the request from browser to proxy to backend"></svg>
        <div class="readouts">
          <div class="col page"><div class="label">Page said</div><div class="value" id="said"></div></div>
          <div class="col"><div class="label">Proxy did</div><div class="value mono" id="proxyNote"></div></div>
          <div class="col truth"><div class="label">Backend saved</div><div class="value big" id="count"></div></div>
        </div>
        <div class="compare" id="compare" hidden>
          <div class="pair">
            <a id="cmpBeforeLink" target="_blank" rel="noopener"><span class="frame"><img id="cmpBeforeImg" alt="Screenshot of the page before the fix" /></span><span class="cap" id="cmpBeforeCap"></span></a>
            <a id="cmpAfterLink" target="_blank" rel="noopener"><span class="frame"><img id="cmpAfterImg" alt="Screenshot of the page after the fix" /></span><span class="cap" id="cmpAfterCap"></span></a>
          </div>
        </div>
        <div class="diag" id="diag" hidden><h3>Diagnosis</h3><ul id="diagList"></ul></div>
        <div class="fix" id="fix" hidden><h3 id="fixTitle"></h3><pre id="fixBody"></pre></div>
        <div class="now" id="now"></div>
      </section>
    </div>
  </main>
  <script>
    (function () {
      var NS = 'http://www.w3.org/2000/svg';
      var TITLES = {
        none: 'Healthy API', error500: 'Server error', slow: 'Slow server', timeout: 'No answer',
        garbage: 'HTML, not JSON', empty: 'Empty reply', reset: 'Dropped', ghost: 'Reply lost', double: 'Double click'
      };
      var NOTES = {
        none: 'passed everything through', error500: 'answered 500, never asked the backend',
        slow: 'held the reply for 6 seconds', timeout: 'never answered',
        garbage: 'answered 200 with an HTML page', empty: 'answered 200 with nothing',
        reset: 'cut the connection', ghost: 'let the backend save it, then lost the reply',
        double: 'held the reply for 2s while the user double clicked'
      };
      var WIRES = {
        none:     { a: 'ok',  b: 'ok',   c: 'ok',   d: 'ok' },
        error500: { a: 'ok',  b: 'off',  c: 'off',  d: 'bad', tag: ['d', '500'] },
        slow:     { a: 'ok',  b: 'slow', c: 'slow', d: 'ok',  tag: ['b', '6s'] },
        timeout:  { a: 'ok',  b: 'off',  c: 'off',  d: 'off', tag: ['d', 'silence'] },
        garbage:  { a: 'ok',  b: 'off',  c: 'off',  d: 'bad', tag: ['d', 'html'] },
        empty:    { a: 'ok',  b: 'off',  c: 'off',  d: 'bad', tag: ['d', 'empty'] },
        reset:    { a: 'cut', b: 'off',  c: 'off',  d: 'off' },
        ghost:    { a: 'ok',  b: 'ok',   c: 'ok',   d: 'cut' },
        double:   { a: 'ok',  b: 'slow', c: 'slow', d: 'ok',  tag: ['b', '2s'] }
      };
      // a: browser to proxy, b: proxy to backend (requests, top lane); c: backend to proxy, d: proxy to browser (replies, bottom lane)
      var GEOM = {
        a: { x1: 160, x2: 240, y: 36, dir: 1 }, b: { x1: 360, x2: 440, y: 36, dir: 1 },
        c: { x1: 440, x2: 360, y: 56, dir: -1 }, d: { x1: 240, x2: 160, y: 56, dir: -1 }
      };
      var list = document.getElementById('list');
      var wire = document.getElementById('wire');
      var nowEl = document.getElementById('now');
      var headlineEl = document.getElementById('headline');
      var targetEl = document.getElementById('target');
      var modeEl = document.getElementById('mode');
      var claimEl = document.getElementById('claim');
      var phasesEl = document.getElementById('phases');
      var diagEl = document.getElementById('diag');
      var diagListEl = document.getElementById('diagList');
      var compareEl = document.getElementById('compare');
      var cmp = {
        before: { link: document.getElementById('cmpBeforeLink'), img: document.getElementById('cmpBeforeImg'), cap: document.getElementById('cmpBeforeCap') },
        after: { link: document.getElementById('cmpAfterLink'), img: document.getElementById('cmpAfterImg'), cap: document.getElementById('cmpAfterCap') }
      };
      var fixEl = document.getElementById('fix');
      var fixTitleEl = document.getElementById('fixTitle');
      var fixBodyEl = document.getElementById('fixBody');
      var history = {};
      var runLabel = 'run';
      var fixInfo = null;
      var stageEl = document.getElementById('stage');
      var els = {};
      ['stageTitle', 'verdict', 'said', 'proxyNote', 'count'].forEach(function (id) { els[id] = document.getElementById(id); });

      var data = {};
      var order = [];
      var noun = 'record';
      var latest = null;
      var pinned = null;
      var hashPin = location.hash.indexOf('#s=') === 0 ? location.hash.slice(3) : null;
      var timer = null;
      var lastWireSig = '';
      var PHASES = ['Break', 'Observe', 'Diagnose', 'Fix', 'Verify'];
      var phaseEls = {};
      var shotsShown = false;

      function make(tag, cls, text) {
        var el = document.createElement(tag);
        if (cls) { el.className = cls; }
        if (text !== undefined) { el.textContent = text; }
        return el;
      }
      function svg(tag, attrs, parent) {
        var el = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach(function (key) { el.setAttribute(key, attrs[key]); });
        if (parent) { parent.appendChild(el); }
        return el;
      }
      function title(scenario) { return TITLES[scenario] || scenario; }
      function say(text, kind) { nowEl.textContent = text; nowEl.className = 'now' + (kind ? ' ' + kind : ''); }

      function reset() {
        data = {}; order = []; latest = null; pinned = null;
        list.textContent = '';
        headlineEl.className = '';
        headlineEl.textContent = 'Waiting for a run';
        claimEl.textContent = '';
        claimEl.className = 'claim';
        say('', '');
        render();
      }

      function verdictOf(result) {
        var why = (result.reasons || []).join(' ');
        if (result.outcome === 'survived') { return 'honest'; }
        if (result.outcome === 'incomplete') { return 'unable to verify'; }
        if (why.indexOf('fake success') !== -1) { return '\u2260 fake success'; }
        if (why.indexOf('duplicate') !== -1) { return '\u2260 duplicate'; }
        return 'no error shown';
      }

      function arrow(g, cls, parent) {
        var tip = g.x2;
        var back = g.x2 - g.dir * 7;
        svg('polygon', { points: back + ',' + (g.y - 4) + ' ' + tip + ',' + g.y + ' ' + back + ',' + (g.y + 4), 'class': cls }, parent);
      }

      function drawWire(scenario, item) {
        var spec = WIRES[scenario] || WIRES.none;
        var result = item.result;
        var sig = scenario + '|' + item.status + '|' + (result ? result.outcome + ':' + (result.orderCount === undefined ? '' : result.orderCount) : '');
        if (sig === lastWireSig) { return; }
        lastWireSig = sig;
        wire.textContent = '';
        var count = result ? (result.orderCount === undefined ? (result.orderCreated ? 1 : 0) : result.orderCount) : null;
        var lie = result && result.outcome === 'failed';
        var honest = result && result.outcome === 'survived';
        var nodes = [[100, 'browser', lie ? 'lie' : (honest ? 'true' : '')], [300, 'proxy', ''], [500, 'backend', count === null ? '' : (count > 0 ? 'true' : 'empty')]];
        nodes.forEach(function (n) {
          svg('rect', { x: n[0] - 60, y: 16, width: 120, height: 60, rx: 6, 'class': 'node ' + n[2] }, wire);
          var label = svg('text', { x: n[0], y: 51, 'class': 'node-label' }, wire);
          label.textContent = n[1];
        });
        ['a', 'b', 'c', 'd'].forEach(function (key) {
          var state = spec[key];
          var g = GEOM[key];
          var cls = 'seg-' + state;
          var line = svg('line', { x1: g.x1, y1: g.y, x2: g.x2, y2: g.y, 'class': 'wire ' + cls + (state === 'off' || state === 'cut' ? ' off' : '') }, wire);
          if (state !== 'off' && state !== 'cut') { arrow(g, cls, wire); }
          if (state === 'cut') {
            var mx = (g.x1 + g.x2) / 2;
            svg('path', { d: 'M' + (mx - 6) + ',' + (g.y - 6) + ' L' + (mx + 6) + ',' + (g.y + 6) + ' M' + (mx + 6) + ',' + (g.y - 6) + ' L' + (mx - 6) + ',' + (g.y + 6), 'class': 'x' }, wire);
          }
        });
        if (spec.tag) {
          var g2 = GEOM[spec.tag[0]];
          var tag = svg('text', { x: (g2.x1 + g2.x2) / 2, y: g2.y + 17, 'class': 'tag' + (spec.tag[1] === '6s' || spec.tag[1] === '2s' ? ' slow' : '') }, wire);
          tag.textContent = spec.tag[1];
        }
        if (item.status === 'running') {
          svg('circle', { cx: 160, cy: 36, r: 4, 'class': 'packet' }, wire);
        }
      }

      function hideShots() {
        if (shotsShown) {
          compareEl.className = 'compare dim';
        } else {
          compareEl.hidden = true;
        }
      }

      function fillShot(side, result, label) {
        var cap = cmp[side].cap;
        cmp[side].img.src = result.screenshot;
        cmp[side].link.href = result.screenshot;
        cap.textContent = '';
        cap.appendChild(document.createTextNode(label + ' \u00B7 '));
        cap.appendChild(make('b', '', verdictOf(result)));
        cap.className = 'cap ' + (result.outcome === 'failed' ? 'bad' : (result.outcome === 'survived' ? 'good' : ''));
      }

      function showShots(name, result) {
        var before = history.before && history.before[name];
        var after = history.after && history.after[name];
        if (before && after && before.screenshot && after.screenshot) {
          fillShot('before', before, 'Before the fix');
          fillShot('after', after, 'After the fix');
          cmp.after.link.className = '';
        } else if (result.screenshot) {
          fillShot('before', result, "Kane's screenshot");
          cmp.after.link.className = 'ghost';
        } else {
          hideShots();
          return;
        }
        shotsShown = true;
        compareEl.hidden = false;
        compareEl.className = 'compare';
      }

      function buildPhases() {
        phasesEl.textContent = '';
        PHASES.forEach(function (name) {
          var span = make('span', 'phase', name);
          phaseEls[name] = span;
          phasesEl.appendChild(span);
        });
      }

      function setPhase(name) {
        var reached = false;
        PHASES.forEach(function (phase) {
          var el = phaseEls[phase];
          if (phase === name) { el.className = 'phase active'; reached = true; }
          else { el.className = 'phase' + (reached ? '' : ' done'); }
        });
      }

      var DIAGNOSIS = [
        ['fake success', 'Fake success', 'The page said the order worked, but the request failed and nothing was saved'],
        ['duplicate', 'Duplicate order', 'A retry or double click created a second order'],
        ['no error shown', 'Silent failure', 'The request failed and the page never told the user'],
        ['unable to verify', 'Unable to verify', 'Not enough evidence to judge']
      ];

      function renderDiagnosis() {
        var results = history[runLabel] || {};
        var groups = {};
        Object.keys(results).forEach(function (scenario) {
          var result = results[scenario];
          if (result.outcome === 'survived') { return; }
          var word = verdictOf(result).replace('\u2260 ', '');
          (groups[word] = groups[word] || []).push(title(scenario));
        });
        diagListEl.textContent = '';
        var any = false;
        DIAGNOSIS.forEach(function (entry) {
          var names = groups[entry[0]];
          if (!names) { return; }
          any = true;
          var li = make('li');
          li.appendChild(make('b', '', names.length + ' \u00D7 ' + entry[1]));
          li.appendChild(document.createTextNode(' ' + entry[2]));
          li.appendChild(make('span', 'names', names.join(', ')));
          diagListEl.appendChild(li);
        });
        diagEl.hidden = !any;
        if (any && runLabel !== 'after') { setPhase('Diagnose'); }
      }

      function renderFix() {
        if (!fixInfo) { fixEl.hidden = true; return; }
        fixTitleEl.textContent = 'Agent fix \u00B7 ' + fixInfo.file;
        fixBodyEl.textContent = '';
        (fixInfo.lines || []).forEach(function (line) {
          var kind = line.charAt(0) === '+' ? 'add' : (line.charAt(0) === '-' ? 'del' : (line.charAt(0) === '@' ? 'hunk' : ''));
          fixBodyEl.appendChild(make('span', kind, line + '\n'));
        });
        fixEl.hidden = false;
      }

      function ensureItem(scenario) {
        if (data[scenario]) { return data[scenario]; }
        var button = make('button', 'item');
        button.type = 'button';
        button.appendChild(make('span', 'dot'));
        button.appendChild(make('span', '', title(scenario)));
        button.onclick = function () { pinned = scenario; render(); };
        list.appendChild(button);
        data[scenario] = { button: button, status: 'waiting', result: null };
        order.push(scenario);
        return data[scenario];
      }

      function render() {
        var name = pinned || hashPin || latest;
        order.forEach(function (scenario) {
          var item = data[scenario];
          item.button.className = 'item ' + item.status + (scenario === name ? ' selected' : '');
        });
        if (!name || !data[name]) {
          stageEl.className = 'stage';
          hideShots();
          return;
        }
        var item = data[name];
        els.stageTitle.textContent = title(name);
        drawWire(name, item);
        els.proxyNote.textContent = NOTES[name] || '';
        if (item.result) {
          var result = item.result;
          var count = result.orderCount === undefined ? (result.orderCreated ? 1 : 0) : result.orderCount;
          stageEl.className = 'stage ' + result.outcome;
          els.verdict.textContent = verdictOf(result);
          els.said.textContent = result.statusMessage === undefined ? 'nothing' : '\u201C' + result.statusMessage + '\u201D';
          var status = String(result.requestStatus === undefined ? '' : result.requestStatus);
          if (status !== '') {
            els.said.appendChild(make('span', 'sub', (status.length === 3 && !isNaN(Number(status)) ? 'request: HTTP ' + status : 'request: ' + status) + (result.statusSource === 'network-log' ? ' \u00B7 network log' : '')));
          }
          els.count.textContent = String(count);
          els.count.appendChild(make('small', '', noun + (count === 1 ? '' : 's')));
          showShots(name, result);
        } else {
          hideShots();
          stageEl.className = 'stage';
          els.verdict.textContent = item.status === 'running' ? 'kane is on it' : '';
          els.said.textContent = item.status === 'running' ? '...' : '';
          els.count.textContent = '';
        }
      }

      function handle(event) {
        var item;
        if (event.type === 'run_start') {
          reset();
          runLabel = event.label || 'run';
          history[runLabel] = {};
          diagEl.hidden = true;
          setPhase(runLabel === 'after' ? 'Verify' : 'Break');
          noun = event.noun || 'record';
          targetEl.textContent = event.target;
          headlineEl.textContent = 'Breaking ' + event.target;
          if (event.claim) { claimEl.textContent = 'Agent claimed: "' + event.claim + '"'; }
          event.scenarios.forEach(ensureItem);
        } else if (event.type === 'scenario_start') {
          item = ensureItem(event.scenario);
          item.status = 'running';
          setPhase(runLabel === 'after' ? 'Verify' : 'Observe');
          latest = event.scenario;
          headlineEl.textContent = 'Running: ' + title(event.scenario);
          say('Kane starts', '');
        } else if (event.type === 'fault') {
          say('fault: ' + event.action, 'fault');
        } else if (event.type === 'kane_line') {
          say('Kane: ' + event.text, '');
        } else if (event.type === 'scenario_result') {
          item = ensureItem(event.scenario);
          item.status = event.outcome;
          item.result = event;
          (history[runLabel] = history[runLabel] || {})[event.scenario] = event;
          latest = event.scenario;
          say('', '');
        } else if (event.type === 'fix') {
          fixInfo = event;
          renderFix();
          setPhase('Fix');
        } else if (event.type === 'run_end') {
          var s = event.summary;
          headlineEl.className = s.failed === 0 && s.incomplete === 0 ? 'good' : 'bad';
          headlineEl.textContent = s.survived + ' of ' + s.total + ' survived';
          if (event.claim) {
            claimEl.textContent = '';
            claimEl.appendChild(document.createTextNode('Agent claimed: "' + event.claim.text + '" \u2192 '));
            claimEl.appendChild(make('b', '', event.claim.verdict));
            claimEl.className = 'claim ' + (event.claim.verdict === 'supported' ? 'good' : (event.claim.verdict === 'not supported' ? 'bad' : 'warn'));
          }
          say('', '');
          renderDiagnosis();
        }
        render();
      }

      function connectLive() {
        modeEl.textContent = ' \u00B7 live';
        var source = new EventSource('/events');
        source.onmessage = function (message) { handle(JSON.parse(message.data)); };
      }

      // Human pacing: long enough to read each result, the diagnosis and the fix.
      function delayFor(event) {
        switch (event.type) {
          case 'run_start': return 1600;
          case 'scenario_start': return 1100;
          case 'fault': return 1400;
          case 'kane_line': return 600;
          case 'scenario_result': return 3500;
          case 'run_end': return 5500;
          case 'fix': return 6500;
          default: return 600;
        }
      }

      var paused = false;
      var speed = 1;
      var SPEEDS = [1, 2, 0.5];
      var replayEvents = null;
      var stepFn = null;
      var controls = null;
      var pauseBtn = null;
      var speedBtn = null;

      function buildControls() {
        controls = make('span', 'controls');
        pauseBtn = make('button', 'again', 'Pause');
        speedBtn = make('button', 'again', '1x');
        var againBtn = make('button', 'again', 'Replay');
        [pauseBtn, speedBtn, againBtn].forEach(function (button) { button.type = 'button'; controls.appendChild(button); });
        pauseBtn.onclick = function () {
          paused = !paused;
          pauseBtn.textContent = paused ? 'Resume' : 'Pause';
          if (paused) { if (timer) { clearTimeout(timer); } }
          else if (stepFn) { stepFn(); }
        };
        speedBtn.onclick = function () {
          speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
          speedBtn.textContent = speed + 'x';
        };
        againBtn.onclick = function () { replay(replayEvents); };
      }

      function replay(events) {
        if (timer) { clearTimeout(timer); }
        replayEvents = events;
        paused = false;
        history = {};
        fixInfo = null;
        fixEl.hidden = true;
        diagEl.hidden = true;
        shotsShown = false;
        compareEl.hidden = true;
        reset();
        setPhase('Break');
        events.forEach(function (event) {
          if (event.screenshot) { var preload = new Image(); preload.src = event.screenshot; }
        });
        modeEl.textContent = ' \u00B7 replay';
        if (!controls) { buildControls(); }
        pauseBtn.textContent = 'Pause';
        modeEl.appendChild(controls);
        var index = 0;
        stepFn = function () {
          if (paused || index >= events.length) { return; }
          var event = events[index];
          handle(event);
          index += 1;
          timer = setTimeout(stepFn, delayFor(event) / speed);
        };
        stepFn();
      }

      buildPhases();
      setPhase('Break');
      fetch('events.json')
        .then(function (response) { if (!response.ok) { throw new Error('no recording'); } return response.json(); })
        .then(replay)
        .catch(connectLive);
    })();
  </script>
</body>
</html>
