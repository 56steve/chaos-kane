<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trail Shop Checkout</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
      button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
      #status { margin-top: 1.5rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Trail Shop</h1>
    <p>Trail Backpack &mdash; $89</p>
    <form id="checkout">
      <label for="name">Full name</label>
      <input id="name" name="name" autocomplete="name" required />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <input type="hidden" name="item" value="Trail Backpack" />
      <button id="place-order" type="submit">Place order</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="/client.js"></script>
  </body>
</html>
